<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="title desc">
  <title id="title">Deepward</title>
  <desc id="desc">Universal checks orchestrator for CI: vulnerable and outdated dependencies, verified fixes as merge and pull requests.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1A2F"/>
      <stop offset="1" stop-color="#14395F"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0.04"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#9FB3C8" fill-opacity="0.12"/>
    </pattern>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- The icon: a shield over a dependency tree whose deep node is fixed. -->
  <g transform="translate(88 104) scale(0.84)">
    <path d="M256 78 L398 130 V258 C398 352 338 414 256 446 C174 414 114 352 114 258 V130 Z"
          fill="url(#shield)" stroke="#5EEAD4" stroke-width="18" stroke-linejoin="round"/>
    <g stroke="#9FB3C8" stroke-width="10" stroke-linecap="round" fill="none">
      <path d="M256 168 L194 240"/>
      <path d="M256 168 L318 240"/>
      <path d="M194 240 L194 318"/>
      <path d="M318 240 L286 330"/>
    </g>
    <g fill="#E2E8F0">
      <circle cx="256" cy="168" r="20"/>
      <circle cx="194" cy="240" r="16"/>
      <circle cx="318" cy="240" r="16"/>
      <circle cx="194" cy="318" r="13"/>
    </g>
    <circle cx="286" cy="334" r="30" fill="#2DD4BF"/>
    <path d="M272 334 L282 345 L302 323" fill="none" stroke="#0A1A2F" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g font-family="Inter, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="560" y="268" font-size="112" font-weight="700" fill="#F8FAFC" letter-spacing="-2">Deepward</text>
    <text x="564" y="332" font-size="36" fill="#9FB3C8">Universal checks orchestrator for CI</text>
    <text x="564" y="420" font-size="27" fill="#5EEAD4">Vulnerable and outdated dependencies,</text>
    <text x="564" y="458" font-size="27" fill="#5EEAD4">verified fixes as merge and pull requests</text>
    <text x="564" y="530" font-size="22" fill="#9FB3C8" fill-opacity="0.8" letter-spacing="1">MAVEN · SBT · NUGET · NPM · GO · CARGO</text>
  </g>
</svg>
