# Release build, run by .github/workflows/release.yml on a v* tag.
# Local dry run: make snapshot.
version: 2

project_name: deepward

builds:
  - id: deepward
    main: ./cmd/deepward
    binary: deepward
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/deepward-oss/deepward/internal/buildinfo.Version={{ .Version }}
      - -X github.com/deepward-oss/deepward/internal/buildinfo.Commit={{ .ShortCommit }}
      - -X github.com/deepward-oss/deepward/internal/buildinfo.Date={{ .CommitDate }}
    # Reproducible: the same commit gives the same binaries.
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

dockers_v2:
  - images:
      - ghcr.io/deepward-oss/deepward
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}{{ .Major }}.{{ .Minor }}{{ end }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    dockerfile: Dockerfile.release
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.title: deepward
      org.opencontainers.image.description: Universal checks orchestrator for CI
      org.opencontainers.image.source: https://github.com/deepward-oss/deepward
      org.opencontainers.image.url: https://github.com/deepward-oss/deepward
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .CommitDate }}"
      org.opencontainers.image.licenses: MIT

release:
  github:
    owner: deepward-oss
    name: deepward
  prerelease: auto

# Release notes come from CHANGELOG.md (--release-notes in the workflow).
changelog:
  disable: true
